[project]
name = "simple-downloader"
version = "0.1.0"
description = "Gestor de descargas con interfaz TUI y engines por protocolo (HLS, HTTP, Telegram, yt-dlp)"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "pycryptodome>=3.23.0",
    "qrcode>=8.2",
    "rich>=15.0.0",
    "telethon>=1.38.0",
    "textual>=8.2.7",
]

[project.scripts]
simple-downloader = "simple_downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/simple_downloader"]

[tool.pytest.ini_options]
markers = [
    "serial",  # used to indicate tests must not run in parallel
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true

[dependency-groups]
dev = [
    "pytest (==9.0.2)",
    "black (==26.3.1)",
    "pytest-asyncio>=1.4.0",
]
